<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1220">
<title>文件传输助手 · 管理台</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="logo">⇅</div>
    <div>
      <h1>文件传输助手</h1>
      <p class="sub" id="srv">正在连接…</p>
    </div>
    <div class="spacer"></div>
    <span class="badge live"><i class="dot"></i> 服务运行中</span>
  </header>

  <div class="panel">
    <h2>📊 概览</h2>
    <div class="toolbar">
      <span class="badge">文件 <b id="cnt">0</b></span>
      <span class="badge">总大小 <b id="size">0 B</b></span>
      <span class="badge">接收目录 <b id="dir">…</b></span>
      <div class="spacer"></div>
      <button class="sm" id="sound" title="有新文件时提示音">🔔 提示音：开</button>
      <button class="sm" id="openFolder">📂 打开文件夹</button>
      <button class="sm primary" id="zipBtn">📦 全部打包下载</button>
    </div>
    <div class="toolbar">
      <input type="search" id="kw" placeholder="搜索文件名…" style="flex:1">
      <button class="sm" id="refresh">↻ 刷新</button>
      <button class="sm" id="upPage">📱 手机上传页</button>
      <button class="sm danger" id="clear">🗑 清空记录</button>
    </div>
  </div>

  <div class="panel">
    <h2>📁 收到的文件 <span class="sub" style="font-weight:400">（点击任意一行即可下载到本机）</span></h2>
    <table class="table">
      <thead>
        <tr>
          <th style="width:45%">文件</th>
          <th>大小</th>
          <th class="hide-sm">接收时间</th>
          <th class="hide-sm">来源</th>
          <th style="text-align:right">操作</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty">暂无文件 —— 用手机扫码即可发送文件到这里</div>
  </div>

  <p class="foot">数据仅在本局域网内传输 · <span id="urlBox"></span></p>
</div>

<div class="toast" id="toast"></div>

<script>
const rowsEl = document.getElementById('rows');
const emptyEl = document.getElementById('empty');
let known = new Set();
let sound = true;

const ICONS = {img:'🖼️',pdf:'📕',zip:'🗜️',vid:'🎬',aud:'🎵',sheet:'📊',slide:'📽️',doc:'📄',apk:'📦',code:'💻'};
function iconOf(name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  if (['png','jpg','jpeg','gif','webp','heic','bmp','svg'].includes(ext)) return ICONS.img;
  if (ext === 'pdf') return ICONS.pdf;
  if (['zip','rar','7z','tar','gz'].includes(ext)) return ICONS.zip;
  if (['mp4','mov','avi','mkv','webm','flv'].includes(ext)) return ICONS.vid;
  if (['mp3','wav','aac','m4a','flac','ogg'].includes(ext)) return ICONS.aud;
  if (['xls','xlsx','csv'].includes(ext)) return ICONS.sheet;
  if (['ppt','pptx','key'].includes(ext)) return ICONS.slide;
  if (['apk','exe','dmg','iso'].includes(ext)) return ICONS.apk;
  if (['py','js','ts','java','go','c','cpp','html','css','json','sh'].includes(ext)) return ICONS.code;
  return ICONS.doc;
}
function fmt(n) {
  const u = ['B','KB','MB','GB','TB'];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i ? n.toFixed(1) : n.toFixed(0)) + ' ' + u[i];
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2000);
}
function beep() {
  if (!sound) return;
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value = 880; o.type = 'sine';
    g.gain.setValueAtTime(0.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.18, ac.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.35);
    o.start(); o.stop(ac.currentTime + 0.36);
  } catch (e) {}
}
function linkOf(f) { return location.origin + '/d/' + f.id; }

/* ---------- 渲染 ---------- */
function render(files) {
  const kw = document.getElementById('kw').value.trim().toLowerCase();
  const list = files.filter(f => !kw || f.name.toLowerCase().includes(kw));
  emptyEl.style.display = list.length ? 'none' : 'block';
  emptyEl.textContent = files.length ? '没有匹配的文件' : '暂无文件 —— 用手机扫码即可发送文件到这里';
  rowsEl.innerHTML = list.map(f => `
    <tr class="fil" data-id="${f.id}" title="点击下载">
      <td>
        <div class="fname">
          <div class="ic">${iconOf(f.name)}</div>
          <div class="tx">
            <div class="n1">${esc(f.name)}</div>
            <div class="n2">${esc(f.ext || '文件')}${f.downloads ? ' · 已下载 ' + f.downloads + ' 次' : ''}</div>
          </div>
        </div>
      </td>
      <td>${fmt(f.size)}</td>
      <td class="hide-sm">${esc(f.uploaded_at)}</td>
      <td class="hide-sm">${esc(f.device || '-')}</td>
      <td>
        <div class="acts">
          <button class="sm" data-act="link" data-id="${f.id}">链接</button>
          <a class="btn sm" href="/d/${f.id}" download>下载</a>
          <button class="sm danger" data-act="del" data-id="${f.id}">删</button>
        </div>
      </td>
    </tr>`).join('');
}

async function refresh(silent) {
  try {
    const [fd, id] = await Promise.all([
      fetch('/api/files').then(r => r.json()),
      fetch('/api/info').then(r => r.json())
    ]);
    if (fd.need_login) { location.href = '/login?next=/admin'; return; }
    document.getElementById('cnt').textContent = fd.stats.count;
    document.getElementById('size').textContent = fmt(fd.stats.total_size);
    document.getElementById('dir').textContent = id.receive_dir;
    document.getElementById('srv').textContent =
      `已运行 ${Math.floor(id.uptime / 60)} 分 ${id.uptime % 60} 秒 · 手机访问 ${location.origin}/upload`;
    const ids = new Set(fd.files.map(f => f.id));
    if (!silent && known.size) {
      let fresh = fd.files.filter(f => !known.has(f.id));
      if (fresh.length) { beep(); toast(`收到 ${fresh.length} 个新文件：${fresh.map(f => f.name).join('、')}`); }
    }
    known = ids;
    render(fd.files);
  } catch (e) {
    document.getElementById('srv').textContent = '服务连接中断，正在重试…';
  }
}

/* ---------- 交互 ---------- */
rowsEl.addEventListener('click', async ev => {
  const btn = ev.target.closest('[data-act]');
  const tr = ev.target.closest('tr.fil');
  if (!tr) return;
  const id = tr.dataset.id;
  if (btn) {
    ev.stopPropagation();
    if (btn.dataset.act === 'link') {
      copy(linkOf({id}));
    } else if (btn.dataset.act === 'del') {
      if (!confirm('确定删除该文件（磁盘文件也会一并删除）？')) return;
      await fetch('/api/files/' + id, {method: 'DELETE'});
      toast('已删除'); refresh(true);
    }
    return;
  }
  // 点击整行 → 立即下载到本机默认下载目录
  const a = document.createElement('a');
  a.href = '/d/' + id; a.download = '';
  document.body.appendChild(a); a.click(); a.remove();
  toast('开始下载');
});

function copy(text) {
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('下载链接已复制'), () => toast('复制失败'));
  else toast('复制失败，请手动复制');
}

document.getElementById('refresh').onclick = () => refresh(true);
document.getElementById('kw').oninput = () => refresh(true);
document.getElementById('zipBtn').onclick = () => { location.href = '/api/bundle'; toast('正在打包下载…'); };
document.getElementById('upPage').onclick = () => window.open('/upload', '_blank');
document.getElementById('openFolder').onclick = async () => {
  const d = await fetch('/api/open-folder', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'}).then(r => r.json());
  toast(d.ok ? '已打开 ' + d.path : ('打开失败：' + d.error));
};
document.getElementById('clear').onclick = async () => {
  if (!confirm('清空全部文件记录？（不删除磁盘文件）')) return;
  const d = await fetch('/api/files', {method: 'DELETE'}).then(r => r.json());
  toast('已清空 ' + d.removed + ' 条记录'); known = new Set(); refresh(true);
};
document.getElementById('sound').onclick = (e) => {
  sound = !sound;
  e.target.textContent = '🔔 提示音：' + (sound ? '开' : '关');
};

refresh(true);
setInterval(() => refresh(false), 2500);
</script>
</body>
</html>
